name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: Comprobar reglas de estilo
        run: ruff check .

      - name: Comprobar formato
        run: ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar la batería de pruebas
        run: python -m pytest -v

      - name: Comprobar que el escenario de demostración funciona
        run: python soc_monitor.py analizar --demo --sin-color

      - name: Comprobar que se instala y el ejecutable arranca
        run: |
          pip install .
          soc-monitor --version
          soc-monitor detectores

  demo:
    name: La demo del README está al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar docs/demo.svg y comprobar que no cambia
        run: |
          python tools/generar_demo.py
          git diff --exit-code docs/demo.svg \
            || (echo "::error::docs/demo.svg está desfasado — ejecuta 'python tools/generar_demo.py' y haz commit" && exit 1)
